# Apache reverse proxy for Roman Urdu Notes
# Install:   sudo apt install -y apache2
# Modules:   sudo a2enmod proxy proxy_http headers rewrite ssl
# Enable:    sudo cp deploy/apache.conf /etc/apache2/sites-available/notes.conf
#            (change ServerName), then:
#            sudo a2ensite notes && sudo apache2ctl configtest && sudo systemctl reload apache2
# HTTPS:     sudo apt install -y certbot python3-certbot-apache
#            sudo certbot --apache -d notes.example.com
#            (certbot adds the :443 virtual host and the http -> https redirect for you)

<VirtualHost *:80>
    ServerName notes.example.com

    ProxyPreserveHost On
    ProxyTimeout 120

    # Always overwrite these so a client can never fake its IP
    RequestHeader set X-Client-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ProxyPass        / http://127.0.0.1:6550/
    ProxyPassReverse / http://127.0.0.1:6550/

    ErrorLog  ${APACHE_LOG_DIR}/notes_error.log
    CustomLog ${APACHE_LOG_DIR}/notes_access.log combined
</VirtualHost>
