# Apache vhost for phpMyAdmin on its own sub-domain, e.g. pma.example.com
# phpMyAdmin listens on 127.0.0.1:8081 (docker-compose). NEVER expose it without a password and HTTPS.
#
# 1) DNS: point pma.example.com to the server
# 2) Password file:   sudo apt install -y apache2-utils
#                     sudo htpasswd -c /etc/apache2/.htpasswd-pma admin
# 3) Modules:         sudo a2enmod proxy proxy_http headers rewrite ssl
# 4) Enable:          sudo cp deploy/apache-phpmyadmin.conf /etc/apache2/sites-available/pma.conf
#                     sudo a2ensite pma && sudo apache2ctl configtest && sudo systemctl reload apache2
# 5) HTTPS:           sudo certbot --apache -d pma.example.com
#
# Even simpler and safest: do not publish it at all and use an SSH tunnel instead:
#     ssh -L 8081:127.0.0.1:8081 user@your-server      ->  open http://127.0.0.1:8081

<VirtualHost *:80>
    ServerName pma.example.com

    <Location />
        AuthType Basic
        AuthName "Database dashboard"
        AuthUserFile /etc/apache2/.htpasswd-pma
        Require valid-user
        # Optional: only allow your own IP as well
        # Require ip 203.0.113.10
    </Location>

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ErrorLog  ${APACHE_LOG_DIR}/pma_error.log
    CustomLog ${APACHE_LOG_DIR}/pma_access.log combined
</VirtualHost>
